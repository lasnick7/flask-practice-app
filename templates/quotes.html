{% extends "layout.html" %}

{% block content %}
<section class="card">
    <h2>Список цитат</h2>

    {% if quotes %}
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Цитата</th>
                    <th>Автор</th>
                    <th>Дата добавления</th>
                    <th>Действие</th>
                </tr>
            </thead>
            <tbody>
                {% for quote in quotes %}
                    <tr>
                        <td>{{ quote.id }}</td>
                        <td>{{ quote.text }}</td>
                        <td>{{ quote.author }}</td>
                        <td>{{ quote.created_at }}</td>
                        <td>
                            <form method="POST" action="/delete/{{ quote.id }}">
                                <button type="submit">Удалить</button>
                            </form>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>Пока в базе нет цитат.</p>
    {% endif %}
</section>
{% endblock %}
